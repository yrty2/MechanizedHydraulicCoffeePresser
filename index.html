<!DOCTYPE html>
<html>
    <head>
        <title>MechanizedHydraulicCofferPresser</title>
        <link rel="preload" href="fontbank/denkichip/x8y12pxDenkiChip.ttf" type="font/ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    </head>
    <style>
        body{
            background-image:url('Back2.png');
            background-repeat:repeat;
            background-attachment:fixed;
            background-size: 128px,128px;
            image-rendering: pixelated;
            color: rgb(255, 255, 255);
        }
        p{
            font-family: 'dchip', sans-serif;
            text-align: center;
            font-size: 70px;
        }
        .siokaze{
            color: rgb(80, 106, 170);
            -webkit-text-stroke:2px rgb(255, 255, 255);
        }
        .lightocean{
            color: rgb(80, 106, 170);
            -webkit-text-stroke:2px rgb(255, 255, 255);
            border: 10px solid;
            height:100px;
            text-anchor: middle;
            border-color: rgb(73, 104, 183);
            background-color: #7db1cf;
            border-radius: 20px;
        }
        .center{
            text-align: center;
            font-size:50px;
        }
        .kadokusei{
            color: rgb(255, 255, 255);
            text-shadow: 5px 5px 0 rgba(65, 83, 197,0.5), -5px -5px 0 rgba(65, 83, 197,0.5), -5px 5px 0 rgba(65, 83, 197,0.5), 5px -5px 0 rgba(65, 83, 197,0.5);
            /*writing-mode: vertical-rl; it is funny tho*/            
        }
        .small{
            font-size: 45px;
        }
    </style>
    <body>
        <h1><p class="lightocean">コーヒープレッサーへようこそ。</p></h1>
        <p class="kadokusei">ここはホームページです。</p>
        <p class="siokaze small">ごゆっくりどうぞ</p>
        <script type="text/javascript" src="main.js"></script>
    </body>
</html>
